    <!-- viewport-fit=cover: la app ocupa hasta el borde; el CSS respeta el notch
         y la barra de gestos con env(safe-area-inset-*).

         SIN user-scalable=no: bloquear el zoom incumple WCAG 1.4.4, y el motivo
         por el que se puso —que iOS amplia solo al enfocar un campo— ya esta
         resuelto en global.css, donde todo campo mide al menos 16 px. Poder
         ampliar importa aqui: las cifras del historial se leen a un brazo de
         distancia y con el pulso acelerado. -->

    <meta name="theme-color" content="#0A0908" />
